name: Fleet Management sync

on:
  pull_request:
    branches: [main]
    paths:
      - 'fleet/**'
      - 'alloy/config.alloy'
      - 'module/**'
      - '.github/workflows/fleet-management-sync.yml'
  push:
    branches: [main]
    paths:
      - 'fleet/**'
      - 'alloy/config.alloy'
      - 'module/**'
      - '.github/workflows/fleet-management-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-management-sync
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            grafana/alloy:v1.21.2 \
            fmt --test /repo/fleet/solaredge.alloy

      - name: Validate against the shipped module
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$PWD/module/metrics.alloy:/etc/alloy/module/metrics.alloy:ro" \
            grafana/alloy:v1.21.2 \
            validate /repo/fleet/solaredge.alloy

      - name: Require fleet pipeline to match alloy/config.alloy
        run: diff -u alloy/config.alloy fleet/solaredge.alloy

  sync:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync pipelines to Fleet Management
        uses: grafana/fleet-management-sync-action@v0.3.0
        with:
          pipelines-root-path: fleet
          fm-url: ${{ secrets.FM_URL }}
          fm-username: ${{ secrets.FM_USERNAME }}
          fm-token: ${{ secrets.FM_TOKEN }}
          namespace: solaredge-olly
          verbose: 'true'
          dry-run: ${{ github.event_name == 'pull_request' }}
