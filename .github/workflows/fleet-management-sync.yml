name: Fleet Management sync

on:
  pull_request:
    branches: [main]
    paths:
      - 'fleet/**'
      - 'module/**'
      - 'alloy/config.alloy'
      - '.github/workflows/fleet-management-sync.yml'
  push:
    branches: [main]
    paths:
      - 'fleet/**'
      - 'module/**'
      - 'alloy/config.alloy'
      - '.github/workflows/fleet-management-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-management-sync
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check formatting
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            grafana/alloy:v1.21.2 \
            fmt --test /repo/fleet/solaredge.alloy

      - name: Check bootstrap formatting
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            grafana/alloy:v1.21.2 \
            fmt --test /repo/alloy/config.alloy

      - name: Validate against the shipped module
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$PWD/module/metrics.alloy:/etc/alloy/module/metrics.alloy:ro" \
            grafana/alloy:v1.21.2 \
            validate /repo/fleet/solaredge.alloy

      - name: Validate the bootstrap
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            grafana/alloy:v1.21.2 \
            validate /repo/alloy/config.alloy

  sync:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # v0.3.0's composite action pins actions/setup-go to a Node 20
      # release and points the Go cache at a path outside the workspace.
      # Both produce annotations on every run. Checking the action out
      # here lets setup-go cache .fm-sync/go.sum inside the workspace.
      - name: Checkout fleet-management-sync-action
        uses: actions/checkout@v7.0.1
        with:
          repository: grafana/fleet-management-sync-action
          ref: v0.3.0
          path: .fm-sync

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .fm-sync/go.mod
          cache-dependency-path: .fm-sync/go.sum

      - name: Sync pipelines to Fleet Management
        working-directory: .fm-sync
        env:
          FM_URL: ${{ secrets.FM_URL }}
          FM_USERNAME: ${{ secrets.FM_USERNAME }}
          FM_TOKEN: ${{ secrets.FM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
        run: |
          trim() {
            local v="$1"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }
          url=$(trim "$FM_URL")
          user=$(trim "$FM_USERNAME")
          token=$(trim "$FM_TOKEN")
          url="${url%/}"
          if [ -z "$url" ] || [ -z "$user" ] || [ -z "$token" ]; then
            echo "::error::FM_URL, FM_USERNAME, and FM_TOKEN must be set."
            exit 1
          fi
          case "$user" in
            *[!0-9]*)
              echo "::error::FM_USERNAME must be the numeric Fleet Management instance id from the API tab, not the stack slug."
              exit 1
              ;;
          esac
          case "$token" in
            *[[:space:]]*)
              echo "::error::FM_TOKEN still contains whitespace. Recreate the secret as a single line."
              exit 1
              ;;
            *:*)
              echo "::error::FM_TOKEN must be the access-policy token only, not username:token."
              exit 1
              ;;
          esac
          export INPUT_FM_URL="$url"
          export INPUT_FM_USERNAME="$user"
          export INPUT_FM_TOKEN="$token"
          export INPUT_TIMEOUT=1m
          export INPUT_VERBOSE=true
          export INPUT_DRY_RUN="$DRY_RUN"
          export INPUT_NAMESPACE=solaredge-olly
          export INPUT_GLOBAL_MATCHER=
          export INPUT_PIPELINES_ROOT_PATH="${GITHUB_WORKSPACE}/fleet"
          go run cmd/sync/main.go
