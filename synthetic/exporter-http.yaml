# Private-probe k6 check. Probe names, not numeric ids.
# alertSensitivity none: this stack rejects legacy SM alert thresholds.
# No contact point is committed.
apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
kind: Check
metadata:
  name: "solaredge-exporter-metrics-66581"
spec:
  job: solaredge-exporter-metrics
  target: http://solaredge-exporter:2112/metrics
  frequency: 60000
  timeout: 15000
  enabled: true
  alertSensitivity: none
  basicMetricsOnly: false
  probes:
    - solaredge
  settings:
    scripted:
      script: |
        // Generated by synthetic-monitoring-checks (https://github.com/grafana/skills) on 2026-10-27T04:48:04Z
        import http from 'k6/http';
        import { expect } from 'https://jslib.k6.io/k6-testing/0.6.1/index.js';

        export const options = {
          vus: 1,
          iterations: 1,
        };

        export default function () {
          const res = http.get('http://solaredge-exporter:2112/metrics');
          expect(res.status).toBe(200);
          const body = String(res.body);
          // Sample lines carry `{`. `AC_Power{` does not match `AC_Power_SF`.
          expect(body).toContain('SunSpec_DID{');
          expect(body).toContain('Status{');
          expect(body).toContain('AC_Power{');
          expect(body).toContain('AC_Power_SF{');
        }
