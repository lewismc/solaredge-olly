# Private-probe MultiHTTP check. Probe names, not numeric ids.
# alertSensitivity none: this stack rejects legacy SM alert thresholds.
# No contact point is committed.
# service_name matches the exporter log stream. The knowledge graph is not
# enabled on this stack, so there is no namespace to copy.
#
# The API stores assertions on each entry as checks, with numeric enums:
# type 0 is text, subject 2 is the status code and 3 is the body,
# condition 2 is equals and 6 is contains.
apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
kind: Check
metadata:
  name: "solaredge-exporter-metrics-66581"
spec:
  job: solaredge-exporter-metrics
  target: http://solaredge-exporter:2112/metrics
  frequency: 60000
  timeout: 15000
  enabled: true
  alertSensitivity: none
  basicMetricsOnly: true
  labels:
    - name: service_name
      value: solaredge-exporter
  probes:
    - solaredge
  settings:
    multihttp:
      entries:
        - request:
            method: GET
            # The check target keeps the hostname so the series identity stays
            # put. The API rejects that single-label name on a MultiHTTP
            # request, and the exporter listens on loopback.
            url: http://127.0.0.1:2112/metrics
          checks:
            - type: 0
              subject: 2
              condition: 2
              value: "200"
            - type: 0
              subject: 3
              condition: 6
              value: "SunSpec_DID{"
            - type: 0
              subject: 3
              condition: 6
              value: "Status{"
            - type: 0
              subject: 3
              condition: 6
              value: "AC_Power{"
            - type: 0
              subject: 3
              condition: 6
              value: "AC_Power_SF{"
