# Grafana-managed rule. service_name routes it to the Slack contact point in notifications/.
# Set grafana.app/folder (label and annotation) to your folder UID before pushing.
# Sleeping (Status == 2) keeps the series and does not match == 7.
apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  name: solaredge-inverter-fault
  labels:
    grafana.app/folder: YOUR_FOLDER_UID
  annotations:
    grafana.app/folder: YOUR_FOLDER_UID
spec:
  title: SolarEdge inverter fault
  # The inverter name stays the series label, so the address is not written here.
  labels:
    service_name: solaredge-exporter
    asserts_env: home
    asserts_site: solaredge
    asserts_entity_type: Inverter
    asserts_alert_category: error
    asserts_severity: critical
  for: 5m0s
  noDataState: Ok
  execErrState: Error
  trigger:
    interval: 1m0s
  annotations:
    summary: SolarEdge inverter Status is Fault (7). Sleeping (2) is healthy.
  expressions:
    InverterStatus:
      datasourceUID: grafanacloud-prom
      queryType: instant
      relativeTimeRange:
        from: 5m0s
        to: 0s
      model:
        expr: Status{job="integrations/solaredge"}
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        queryType: instant
        refId: InverterStatus
    IsFault:
      model:
        type: math
        expression: $InverterStatus == 7
        refId: IsFault
        intervalMs: 1000
        maxDataPoints: 43200
    FaultFired:
      source: true
      model:
        type: threshold
        expression: IsFault
        refId: FaultFired
        intervalMs: 1000
        maxDataPoints: 43200
        conditions:
          - evaluator:
              type: gt
              params:
                - 0
            type: gt
